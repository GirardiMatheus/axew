defaultRules:
  create: true

alertmanager:
  enabled: false

grafana:
  enabled: true

  service:
    type: ClusterIP

  persistence:
    enabled: false

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      labelValue: '1'
      searchNamespace: monitoring

prometheus:
  enabled: true

  service:
    type: ClusterIP

  prometheusSpec:
    retention: 3d
    scrapeInterval: 30s
    evaluationInterval: 30s

    # Allow discovery of ServiceMonitors across namespaces.
    serviceMonitorSelectorNilUsesHelmValues: false
    serviceMonitorSelector: {}
    serviceMonitorNamespaceSelector: {}

    resources:
      requests:
        cpu: 200m
        memory: 512Mi
      limits:
        cpu: '1'
        memory: 1Gi

kubeStateMetrics:
  enabled: true

nodeExporter:
  enabled: true
