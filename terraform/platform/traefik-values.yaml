deployment:
  enabled: true
  kind: Deployment
  replicas: 1

service:
  enabled: true
  spec:
    type: ClusterIP

nodeSelector:
  kubernetes.io/hostname: axew-control-plane

tolerations:
  - key: node-role.kubernetes.io/control-plane
    operator: Exists
    effect: NoSchedule

ports:
  web:
    port: 8000
    exposedPort: 80
    hostPort: 80

providers:
  kubernetesIngress:
    enabled: true

ingressClass:
  enabled: true
  isDefaultClass: false
  name: traefik
